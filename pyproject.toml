[project]
name = "second"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "oghenejivwe", email = "oghenejivwe@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore>=1.22.0",
    "boto3>=1.43.91",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "google-api-python-client==2.200.0",
    "google-auth-oauthlib==1.4.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "strands-agents[anthropic]>=1.55.1",
    "strands-agents-tools>=0.8.8",
    "tzlocal>=5.4.4",
]

[project.scripts]
second = "second:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "moto>=5.2.3",
    "pytest==9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
